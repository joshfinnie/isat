<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>iSat — Satellite Tracker</title>
        <link rel="stylesheet" href="/cesium/Widgets/widgets.css" />
        <style>
            html,
            body,
            #cesiumContainer {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #000;
            }
            #status {
                position: absolute;
                top: 10px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.6);
                color: #fff;
                padding: 6px 14px;
                border-radius: 4px;
                font: 13px/1.4 sans-serif;
                pointer-events: none;
                z-index: 10;
            }
        </style>
    </head>
    <body>
        <div id="cesiumContainer"></div>
        <div id="status">Loading TLEs…</div>
        <!-- Must be set before the Cesium module loads so internal asset fetches resolve correctly -->
        <script>
            window.CESIUM_BASE_URL = "/cesium/";
        </script>
        <script type="module" src="./index.js"></script>
    </body>
</html>

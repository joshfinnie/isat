<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>iSat — Satellite Tracker</title>
        <link rel="stylesheet" href="/cesium/Widgets/widgets.css" />
        <style>
            html,
            body,
            #cesiumContainer {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #000;
            }
            #controls {
                position: absolute;
                top: 10px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.6);
                color: #fff;
                padding: 10px 18px;
                border-radius: 4px;
                font: 13px/1.4 sans-serif;
                z-index: 10;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }
            #satelliteSearch {
                background: #222;
                color: #fff;
                border: 1px solid #444;
                padding: 6px 10px;
                border-radius: 4px;
                width: 200px;
                font: inherit;
            }
            #groupSelect {
                background: #333;
                color: #fff;
                border: 1px solid #555;
                padding: 4px 8px;
                border-radius: 4px;
                font: inherit;
                cursor: pointer;
            }
            #status {
                margin: 0;
                pointer-events: none;
            }
            #detailsPanel {
                position: absolute;
                top: 10px;
                right: 10px;
                background: rgba(0, 0, 0, 0.75);
                color: #fff;
                padding: 15px;
                border-radius: 4px;
                width: 220px;
                display: none;
                z-index: 10;
                font: 13px/1.6 sans-serif;
            }
            #detailsPanel h2 {
                margin: 0 0 10px 0;
                font-size: 16px;
                border-bottom: 1px solid #444;
                padding-bottom: 5px;
            }
            #detailsPanel .stat {
                display: flex;
                justify-content: space-between;
            }
            #detailsPanel .label {
                color: #aaa;
            }
            #detailsPanel button {
                margin-top: 15px;
                width: 100%;
                background: #c33;
                color: #fff;
                border: none;
                padding: 5px;
                border-radius: 3px;
                cursor: pointer;
            }
            #tooltip {
                position: absolute;
                display: none;
                background: rgba(0, 0, 0, 0.8);
                color: white;
                padding: 4px 8px;
                border-radius: 4px;
                font: 12px sans-serif;
                pointer-events: none;
                z-index: 20;
                white-space: nowrap;
            }
        </style>
    </head>
    <body>
        <div id="cesiumContainer"></div>
        <div id="tooltip"></div>
        <div id="detailsPanel">
            <h2 id="satName">-</h2>
            <div class="stat"><span class="label">Lat:</span> <span id="satLat">-</span>°</div>
            <div class="stat"><span class="label">Lon:</span> <span id="satLon">-</span>°</div>
            <div class="stat"><span class="label">Alt:</span> <span id="satAlt">-</span> km</div>
            <div class="stat"><span class="label">Vel:</span> <span id="satVel">-</span> km/s</div>
            <button id="closeDetails">Close</button>
        </div>
        <div id="controls">
            <input type="text" id="satelliteSearch" placeholder="Search satellites..." />
            <select id="groupSelect">
                <option value="cubesat">CubeSats</option>
                <option value="last-30-days">Last 30 Days</option>
                <option value="stations">Stations</option>
                <option value="active">Active (Global)</option>
                <option value="starlink">Starlink</option>
                <option value="geo">Geostationary</option>
                <option value="gps-ops">GPS</option>
                <option value="weather">Weather</option>
                <option value="iridium-33-debris">Iridium 33 Debris</option>
                <option value="cosmos-2251-debris">Cosmos 2251 Debris</option>
                <option value="fengyun-1c-debris">Fengyun 1C Debris</option>
            </select>
            <div id="status">Loading TLEs…</div>
        </div>
        <!-- Must be set before the Cesium module loads so internal asset fetches resolve correctly -->
        <script>
            window.CESIUM_BASE_URL = "/cesium/";
        </script>
        <script type="module">
            import * as Cesium from "cesium";
            window.Cesium = Cesium;
        </script>
        <script type="module" src="./index.js"></script>
    </body>
</html>
